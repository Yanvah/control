name: Publish versioned image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version and vVERSION Git tag, without the v prefix.
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      revision: ${{ steps.metadata.outputs.revision }}
    steps:
      - name: Require an explicitly enabled release configuration
        env:
          CONTROL_PUBLISH_ENABLED: ${{ vars.CONTROL_PUBLISH_ENABLED }}
        run: |
          if [[ "$CONTROL_PUBLISH_ENABLED" != 'true' ]]; then
            echo '::error::Configure private security reporting, the release environment, and package permissions before setting the repository variable CONTROL_PUBLISH_ENABLED=true.'
            exit 1
          fi
      - name: Check out the exact event revision and version tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Verify package version and existing tag
        id: metadata
        env:
          CONTROL_RELEASE_VERSION: ${{ inputs.version }}
          CONTROL_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release-metadata.mjs
  validate:
    needs: release
    uses: ./.github/workflows/validate.yml
    with:
      export-image: true
  publish:
    needs: [release, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_IMAGE: ${{ needs.release.outputs.image }}
      RELEASE_REVISION: ${{ needs.release.outputs.revision }}
      TESTED_IMAGE_ID: ${{ needs.validate.outputs.image-id }}
    steps:
      - name: Download the tested image from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-image
          path: image
          digest-mismatch: error
      - name: Load and verify the tested image
        run: |
          gzip -dc image/control-image.tar.gz | docker load
          actual_id=$(docker image inspect yanvah-control:local --format '{{.Id}}')
          if [[ "$actual_id" != "$TESTED_IMAGE_ID" ]]; then
            echo '::error::The downloaded image does not match the image validated in this run.'
            exit 1
          fi
          docker tag "$TESTED_IMAGE_ID" "$RELEASE_IMAGE"
      - name: Sign in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the explicit version
        run: |
          docker push "$RELEASE_IMAGE"
          printf 'Published `%s` from `%s`. Pin the registry digest below in deployments.\n\n' "$RELEASE_IMAGE" "$RELEASE_REVISION" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "$RELEASE_IMAGE" --format '{{join .RepoDigests "\n"}}' >> "$GITHUB_STEP_SUMMARY"
