name: Feature request
description: Describe an operational problem within Control's scope.
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
      description: Describe the administration workflow and its impact.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what Control should do and which SaaS capability it would need.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
